# =============================================================================
# Local development configuration: MySQL build with Keycloak as the identity
# provider
# =============================================================================
#
# Use with a syncserver built with `--no-default-features
# --features=syncstorage-db/mysql` (see Dockerfile.keycloak) and a
# Keycloak server with the realm in keycloak/realm-export.json, for example the
# one from docker/docker-compose.mysql.keycloak.yaml:
#
#     cargo run --no-default-features --features=syncstorage-db/mysql \
#         -- --config config/local.keycloak.toml
#
# The general settings are explained in config/local.example.toml and
# docs/src/config.md.
# =============================================================================

# REQUIRED. Secret used to derive the Hawk signing/token secrets.
master_secret = "INSERT_SECRET_KEY_HERE"

human_logs = 1

# -----------------------------------------------------------------------------
# Syncstorage
# -----------------------------------------------------------------------------
syncstorage.enabled = true
syncstorage.database_url = "mysql://test:test@localhost:3306/syncstorage"
syncstorage.enable_quota = 0
syncstorage.limits.max_total_records = 9984

# -----------------------------------------------------------------------------
# Tokenserver
# -----------------------------------------------------------------------------
tokenserver.enabled = true
tokenserver.database_url = "mysql://test:test@localhost:3306/tokenserver"
tokenserver.node_type = "mysql"
tokenserver.run_migrations = true
# Storage node assigned to users; this server's own syncstorage.
tokenserver.init_node_url = "http://localhost:8000"

# Users' emails are built as "<keycloak subject>@<fxa_email_domain>".
tokenserver.fxa_email_domain = "localhost"

# REQUIRED for real deployments. Secret used to hash users' metrics UIDs.
tokenserver.fxa_metrics_hash_secret = "INSERT_SECRET_KEY_HERE"

# Verify tokens from Keycloak (a generic OIDC provider) instead of FxA. Keys are
# fetched from {oidc_issuer_url}/protocol/openid-connect/certs, and tokens must
# carry oidc_issuer_url as `iss`, oidc_audience in `aud`, and the oldsync scope.
tokenserver.oauth_provider = "oidc"
tokenserver.oidc_issuer_url = "http://localhost:7080/realms/sync"
tokenserver.oidc_audience = "tokenserver"

# -----------------------------------------------------------------------------
# CORS (optional)
# -----------------------------------------------------------------------------
# cors_allowed_origin = "localhost"
# cors_max_age = 86400
