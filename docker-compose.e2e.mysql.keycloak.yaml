version: "3"
services:
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: true
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 15s
      timeout: 2s
      retries: 15
    command: ["start-dev", "--http-port", "7080", "--https-port", "7443", "--import-realm"]
    volumes: # Ignore if you don't have realm-export.json to migrate data
      - ./keycloak-import:/opt/keycloak/data/import
    ports:
      - "7080:7080"
      - "7443:7443"

  sync-db:
    image: docker.io/library/mysql:5.7
    volumes:
      - sync_db_data:/var/lib/mysql
    restart: always
    ports:
      - "3306"
    command: --explicit_defaults_for_timestamp
    environment:
      MYSQL_ROOT_PASSWORD: random
      MYSQL_DATABASE: syncstorage
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin -uroot -p$${MYSQL_ROOT_PASSWORD} version"]
      interval: 2s
      retries: 10
      start_period: 20s
      timeout: 2s

  tokenserver-db:
    image: docker.io/library/mysql:5.7
    volumes:
      - tokenserver_db_data:/var/lib/mysql
    restart: always
    ports:
      - "3306"
    command: --explicit_defaults_for_timestamp
    environment:
      MYSQL_ROOT_PASSWORD: random
      MYSQL_DATABASE: tokenserver
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin -uroot -p$${MYSQL_ROOT_PASSWORD} version"]
      interval: 2s
      retries: 10
      start_period: 20s
      timeout: 2s

  syncserver:
    image: app:build
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      sync-db:
        condition: service_healthy
      tokenserver-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SYNC_HOST: 0.0.0.0
      SYNC_MASTER_SECRET: secret0
      SYNC_SYNCSTORAGE__DATABASE_URL: mysql://test:test@sync-db:3306/syncstorage
      SYNC_TOKENSERVER__DATABASE_URL: mysql://test:test@tokenserver-db:3306/tokenserver
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
      SYNC_TOKENSERVER__ENABLED: "true"
      SYNC_TOKENSERVER__OAUTH_PROVIDER_TYPE: "oidc"
      SYNC_TOKENSERVER__OIDC_ISSUER_URL: "http://keycloak:7080/realms/sync"
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: "http://keycloak:7080/realms/sync"
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: "localhost"
      SYNC_TOKENSERVER__FXA_METRICS_HASH_SECRET: "secret0"
      RUST_BACKTRACE: 1

  mysql-e2e-tests:
    container_name: mysql-e2e-tests
    depends_on:
      sync-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      tokenserver-db:
        condition: service_healthy
    # this depend is to avoid migration collisions.
    # the syncserver isn't actually used for the tests,
    # but collisions can happen particularly in CI.
      syncserver:
        condition: service_started
    image: app:build
    privileged: true
    user: root
    environment:
      JWK_CACHE_DISABLED: false
      KEYCLOAK_URL: http://keycloak:7080
      SYNC_HOST: 0.0.0.0
      SYNC_MASTER_SECRET: secret0
      SYNC_SYNCSTORAGE__DATABASE_URL: mysql://test:test@sync-db:3306/syncstorage
      SYNC_TOKENSERVER__DATABASE_URL: mysql://test:test@tokenserver-db:3306/tokenserver
      SYNC_TOKENSERVER__ENABLED: "true"
      SYNC_TOKENSERVER__RUN_MIGRATIONS: "true"
      SYNC_TOKENSERVER__OAUTH_PROVIDER_TYPE: "oidc"
      SYNC_TOKENSERVER__OIDC_ISSUER_URL: "http://keycloak:7080/realms/sync"
      SYNC_TOKENSERVER__FXA_OAUTH_SERVER_URL: "http://keycloak:7080/realms/sync"

      TOKENSERVER_HOST: http://localhost:8000
    entrypoint: >
      /bin/sh -c "
        exit_code=0;
        pytest /app/tools/integration_tests/ --junit-xml=/mysql_integration_results.xml || exit_code=$$?;
        export JWK_CACHE_DISABLED=true;
        pytest /app/tools/integration_tests/ --junit-xml=/mysql_no_jwk_integration_results.xml || exit_code=$$?;
        exit $$exit_code;
      "

volumes:
  sync_db_data:
  tokenserver_db_data:
