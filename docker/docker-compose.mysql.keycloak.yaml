# Overlay for docker-compose.mysql.yaml that runs syncserver with Keycloak as the
# identity provider instead of FxA. Start it with:
#
#     make docker_start_mysql_keycloak
#
# This builds syncserver from Dockerfile.keycloak. Keycloak listens on
# http://localhost:7080 and imports the "sync" realm from
# keycloak/realm-export.json on first start. To use the admin console, create an
# admin user with:
#
#     docker compose -f docker/docker-compose.mysql.yaml \
#         -f docker/docker-compose.mysql.keycloak.yaml \
#         exec keycloak /opt/keycloak/bin/kc.sh bootstrap-admin user

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.4
    command: ["start-dev", "--http-port", "7080", "--import-realm"]
    environment:
      KC_HEALTH_ENABLED: "true"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 2s
      retries: 30
      start_period: 20s
    volumes:
      - ../keycloak:/opt/keycloak/data/import:ro
    ports:
      - "7080:7080"

  syncserver:
    image: syncstorage-rs:keycloak
    build:
      context: ..
      dockerfile: Dockerfile.keycloak
      args:
        SYNCSTORAGE_DATABASE_BACKEND: mysql
        TOKENSERVER_DATABASE_BACKEND: mysql
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      SYNC_TOKENSERVER__ENABLED: "true"
      SYNC_TOKENSERVER__FXA_EMAIL_DOMAIN: localhost
      SYNC_TOKENSERVER__OAUTH_PROVIDER: keycloak
      SYNC_TOKENSERVER__KEYCLOAK_SERVER_URL: http://keycloak:7080
      SYNC_TOKENSERVER__KEYCLOAK_REALM: sync
      SYNC_TOKENSERVER__OAUTH_PROVIDER_TYPE: oidc
      SYNC_TOKENSERVER__OIDC_ISSUER_URL: http://keycloak:7080/realms/sync
      RUST_BACKTRACE: 1
